<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucky Draw Spinner</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .controls {
      margin-bottom: 20px;
    }

    input {
      padding: 8px 12px;
      margin: 0 10px;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
      width: 80px;
      text-align: center;
    }

    .spinner {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px 0;
    }
.spinning {
  color: #00ff88;
  border-color: #00ff88;
  box-shadow: 0 0 20px #00ff8899;
  transition: all 0.2s ease-in-out;
}

    .digit {
  background: #222;
  padding: 30px;
  font-size: 8rem;
  border-radius: 15px;
  border: 3px solid #00ff88;        /* Default: glowing border when stopped */
  box-shadow: 0 0 20px #00ff8899;    /* Glow when digit is stopped */
  width: 120px;
  text-align: center;
  color: #00ff88;
  transition: all 0.2s ease-in-out;
}

.digit.spinning {
  border-color: transparent;   /* Remove border while spinning */
  box-shadow: none;            /* Remove glow while spinning */
  color: white;                /* Optional: white while spinning */
}

    button {
      padding: 15px 40px;
      font-size: 1.5rem;
      background-color: #00ff88;
      border: none;
      color: #111;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #00dd77;
    }

    .history {
      margin-top: 40px;
    }

    .history-list {
  display: flex;
  flex-direction: column;  /* stack vertically */
  align-items: flex-start;
  gap: 8px;
  margin: 0 auto;
  max-width: 300px;
}

    .card {
  background: #222;
  border-left: 5px solid #00ff88;
  padding: 10px 40px 10px 15px;
  border-radius: 5px;
  font-size: 1.8rem;
  color: #00ff88;
  position: relative;
  width: 100%;
}

.remove-btn {
  position: absolute;
  right: 10px;
  top: 10px;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: red;
  font-size: 1.2rem;
  cursor: pointer;
}



    
  </style>
</head>
<body>

  <h1>🎉 Lucky Draw Spinner 🎉</h1>

  <div class="controls">
    <label>Min: <input type="number" id="min" value="1" min="1" max="999"></label>
    <label>Max: <input type="number" id="max" value="260" min="1" max="999"></label>
  </div>

  <div class="spinner">
    <div class="digit" id="digit1">0</div>
    <div class="digit" id="digit2">0</div>
    <div class="digit" id="digit3">0</div>
  </div>

  <button onclick="startDraw()">Generate</button>

  <div class="history">
    <h2>🎯 Draw History</h2>
    <div class="history-list" id="historyList"></div>
  </div>

  <audio id="spinSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_33f1737db4.mp3?filename=dial-spinning-93315.mp3"></audio>
  <audio id="stopSound" src="https://cdn.pixabay.com/download/audio/2022/02/24/audio_2677cfb4ff.mp3?filename=click-124467.mp3"></audio>

  <script>
    const digitEls = [
      document.getElementById('digit1'),
      document.getElementById('digit2'),
      document.getElementById('digit3')
    ];
    const spinSound = document.getElementById('spinSound');
    const stopSound = document.getElementById('stopSound');
    const historyList = document.getElementById('historyList');

    let availableNumbers = [];
    let drawnNumbers = new Set();
    let spinIntervals = [null, null, null];

    function padNumber(num) {
      return String(num).padStart(3, '0');
    }

    function initAvailableNumbers(min, max) {
      availableNumbers = [];
      for (let i = min; i <= max; i++) {
        availableNumbers.push(i);
      }
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function getNextUniqueNumber() {
      if (availableNumbers.length === 0) return null;
      shuffle(availableNumbers);
      let next = availableNumbers.pop();
      drawnNumbers.add(next);
      return next;
    }

    function startDigitSpin(index) {
  digitEls[index].classList.add('spinning');
  spinIntervals[index] = setInterval(() => {
    digitEls[index].textContent = Math.floor(Math.random() * 10);
  }, 50);
}

function stopDigit(index, finalDigit, delay) {
  setTimeout(() => {
    clearInterval(spinIntervals[index]);
    digitEls[index].textContent = finalDigit;
    digitEls[index].classList.remove('spinning'); // glow returns here
    stopSound.currentTime = 0;
    stopSound.play();
  }, delay);
}



    function addToHistory(numStr) {
      const card = document.createElement('div');
      card.className = 'card';
      card.textContent = numStr;

      const btn = document.createElement('button');
      btn.className = 'remove-btn';
      btn.textContent = '×';
      btn.onclick = () => {
        const num = parseInt(numStr);
        drawnNumbers.delete(num);
        availableNumbers.push(num);
        card.remove();
      };

      card.appendChild(btn);
      historyList.prepend(card);
    }

    let lastMin = null;
let lastMax = null;

function startDraw() {
  const min = parseInt(document.getElementById('min').value) || 1;
  const max = parseInt(document.getElementById('max').value) || 999;

  if (min >= max || min < 1 || max > 999) {
    alert("Invalid range!");
    return;
  }

  // ✅ Rebuild if min/max changed
  if (min !== lastMin || max !== lastMax) {
    initAvailableNumbers(min, max);
    drawnNumbers.clear();
    lastMin = min;
    lastMax = max;
  }

  const number = getNextUniqueNumber();
  if (number === null) {
    alert("🎉 All numbers have been drawn!");
    return;
  }

  const digits = padNumber(number).split('');

  // Start all digit spinners
  spinSound.currentTime = 0;
  spinSound.play();
  for (let i = 0; i < 3; i++) startDigitSpin(i);

  const baseDelay = 1000; // control this value to speed up or slow down

stopDigit(2, digits[2], baseDelay);
stopDigit(1, digits[1], baseDelay * 2.5);
stopDigit(0, digits[0], baseDelay * 4);

  // Add to history after all digits stop
  setTimeout(() => {
    addToHistory(padNumber(number));
  },baseDelay * 4 );
}

  </script>

</body>
</html>
